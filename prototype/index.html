    }
  };
  const draft = templates[kind];
  if (!draft) throw new Error('NO_DRAFT');
  return { ...draft, disclaimer: pick('雲の AI の見立てを固定の見本で再現しています。見立てであり、確定した原因ではありません。開発者の確認が必要です。', 'A fixed sample simulates a cloud AI draft. This is a hypothesis, not a confirmed cause. Developer review is required.') };
}
function currentDraft() { return mockCloudDraft(state.syntheticReport, C.importerCode(), state.lang); }
function draftText() {
  const d = currentDraft();
  return ['DRAFT · ' + d.title, d.disclaimer, tr('根拠: ', 'Evidence: ') + d.evidence, tr('見立て: ', 'Hypothesis: ') + d.hypothesis, tr('直し方の案: ', 'Suggested fix: ') + d.fix, tr('回帰の確認: ', 'Regression check: ') + d.regression].join('\n\n');
}
function reportPanel() {
  const d = currentDraft();
  return `<section class="report"><div class="title-row">${icon('cloud')}<h3>${tr('開発者への報告', 'Developer report')}</h3></div><span class="badge">${tr('下書き · 雲の AI の見本', 'DRAFT · mock cloud AI')}</span><h4>${esc(d.title)}</h4><p>${esc(d.disclaimer)}</p><dl>${[[tr('根拠', 'Evidence'), d.evidence], [tr('見立て', 'Hypothesis'), d.hypothesis], [tr('直し方の案', 'Suggested fix'), d.fix], [tr('回帰の確認', 'Regression check'), d.regression]].map(([a,b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl></section>`;
}
function validationDetails() {
  const labels = { encoding: tr('文字の符号', 'Encoding'), required: tr('必須の列', 'Required columns'), newline: tr('セル内の改行', 'Embedded newline'), duplicate: tr('鍵の重複', 'Duplicate keys') };

function transferColumns() {
  return `<div class="transfer"><section class="privacy-card"><h3>${icon('cloud')}${tr('外へ出る物（共有を行う場合）', 'Would leave this device if shared')}</h3><ul><li>${tr('架空の再現 CSV（3 行）', 'Synthetic CSV (3 rows)')}</li><li>${tr('取り込みの検査コード r17', 'Importer validation code r17')}</li><li>${tr('失敗の指紋・検査の結果（元の行番号なし）', 'Fingerprint and validation results (no original row numbers)')}</li><li>${tr('架空の再現だけに基づく報告の下書き', 'Draft report based only on the synthetic repro')}</li></ul><p>${tr('この試作は送信せず、書き出す内容を画面で見せるだけです。', 'This prototype only previews the bundle; it does not send it.')}</p></section><section class="privacy-card"><h3>${icon('lock')}${tr('外へ出ない物', 'Never leaves this device')}</h3><ul><li>${tr('客の CSV 本体', 'Original customer CSV')}</li><li>${tr('元のファイル名・行の中身・元の行番号', 'Original filename, row contents and row numbers')}</li><li>${tr('元の生ログ・端末 AI の候補・担当者の選択', 'Raw original logs, local AI candidates and manual choices')}</li></ul><p>${tr('元の値は報告の下書きにも、共有の束にも入れません。', 'Original values are excluded from the draft and the bundle.')}</p></section></div>`;
}
function mainActions() {
  return `<div class="action-bar"><div class="validator">${icon('shield')}<span>${tr('同じ検査', 'Same validator')} · r17<br><span class="small">${tr('生成・検査・照合は端末内', 'Generation, validation & matching stay local')}</span></span></div><div class="action-buttons">${button('rerun', tr('もう一度検査', 'Run again'), { icon: 'refresh', disabled: !state.synthetic })}${button('generate', tr('架空の再現を作る', 'Create synthetic repro'), { icon: 'spark', primary: !matched(), disabled: !state.source || !state.condition || (state.ai && !state.candidates) || state.busy })}${button('review', tr('共有する物を確かめる', 'Review handoff'), { icon: 'arrow', primary: matched(), disabled: !matched() })}</div></div>`;
}
function reviewActions() {
  return `<div class="action-bar review-actions"><div><label class="confirm"><input type="checkbox" id="approval" ${state.approved ? 'checked' : ''}>${tr('共有する物と出ない物、報告が見立てであることを確かめました', 'I reviewed the sharing boundary and understand the report is a hypothesis.')}</label><span class="small">${tr('次の操作でも送信・保存はしません。共有の束の内容だけを表示します。', 'The next step does not send or save anything. It displays the bundle contents.')}</span></div><div class="action-buttons">${button('back', tr('検査の画面へ戻る', 'Back to evidence'))}${button('bundle', tr('共有の束を書き出す', 'Export sharing bundle'), { icon: 'file', primary: true, disabled: !state.approved || !matched() })}</div></div>`;
}
function noticeText() {
  return ({ loaded: tr('見本の CSV を読み込みました。64 行はすべて架空です。次に、端末の候補または手動の条件を確認してください。', 'Loaded 64 fictional sample rows. Next, review the local suggestions or select a condition manually.'), imported: tr('CSV を端末内に読み込み、検査しました。外へは送っていません。', 'CSV read and validated locally. Nothing was uploaded.'), tooLarge: tr('読み込めませんでした。ファイルの上限は 2 MiB です。', 'Could not load the file: the size limit is 2 MiB.'), readError: tr('ファイルを読み込めませんでした。もう一度選んでください。', 'Could not read the file. Choose it again.'), changed: tr('条件を変更しました。新しい条件で再現を作り直してください。', 'Condition changed. Create a new reproduction.'), aiChanged: tr('端末 AI の設定を変更しました。条件の確認からやり直してください。', 'Local AI setting changed. Review the condition again.'), candidates: tr('固定の見本の候補を表示しました。重複する鍵が選ばれています。', 'Showing the fixed sample suggestions. Duplicate key is selected.'), matched: tr('同じ失敗の指紋を確認しました。共有する物を確かめられます。', 'Matching failure fingerprints confirmed. You can review the handoff.'), mismatch: tr('指紋が一致しないため、共有前の画面へは進めません。条件を見直してください。', 'Handoff is blocked because the fingerprints differ. Review the condition.'), busy: tr('ファイルを端末内で読み込んでいます…', 'Reading the file locally…') })[state.notice] || '';
}
function render() {
  document.documentElement.lang = state.lang;
  document.title = tr('CaseTwin — 失敗の指紋', 'CaseTwin — Failure fingerprint');
  const review = state.view === 'review';
  const step = review ? '05' : state.synthetic ? '04' : state.candidates || !state.ai && state.condition ? '03' : state.source ? '02' : '01';
  document.getElementById('app').innerHTML = `<header class="top"><div class="brand">${icon('logo')}CaseTwin<small>C3 / ${tr('失敗の指紋', 'Failure fingerprint')}</small></div><div class="head-actions"><div class="language" role="group" aria-label="${tr('表示言語', 'Language')}"><button type="button" data-action="ja" aria-pressed="${state.lang === 'ja'}">日本語</button><button type="button" data-action="en" aria-pressed="${state.lang === 'en'}">EN</button></div><button type="button" class="settings" data-action="settings" aria-label="${tr('設定', 'Settings')}">${icon('settings')}<span class="settings-label">${tr('設定', 'Settings')}</span></button></div></header>
  ${state.lang === 'ja' ? '<aside class="guide"><div class="guide-inner">' + icon('laptop') + '<span>これは試作です。何から押すか: ① 見本の CSV を読み込む ② 端末の AI の候補を見る ③『架空の再現を作る』を押す ④ 同じ検査の結果（失敗の指紋）を見る ⑤『共有する物を確かめる』で渡す前の画面を見る。押してもお金はかからず、何も外へ送られません（この画面の中だけで動きます）。</span></div></aside>' : ''}
  <main class="shell"><div class="page-heading"><div><div class="eyebrow">${review ? tr('共有前の確認', 'REVIEW / HANDOFF') : tr('端末内で再現を確かめる', 'LOCAL REPRODUCTION WORKSPACE')}</div><h1>${review ? tr('渡す前に同じ失敗を確かめる。', 'Review the matched failure.') : tr('ひとつの失敗。ふたつの入力。', 'One failure. Two matching inputs.')}</h1><p class="subheading">${review ? tr('元の CSV は端末の中に。開発者へは要る再現物だけ。', 'Keep the original on this device. Give developers the reproduction they need.') : tr('客のデータを持ち出さず、開発者が試せる小さな再現へ。', 'Turn a private customer failure into a small, shareable reproduction.')}</p></div><div class="step-count">${tr('手順', 'STEP')} <strong>${step}</strong> / 05 · ${tr('動作する試作', 'Interactive prototype')}</div></div>
  <div class="environment"><div class="boundary"><span>${icon('laptop')}<strong>LOCAL</strong> ${tr('CSV の分析・生成・検査', 'CSV analysis, synthesis & validation')}</span><span>${icon('cloud')}<strong>CLOUD</strong> ${tr('架空の再現とコードだけ · 今は見本', 'Synthetic repro + code only · simulated')}</span></div><div class="ai-switch"><span>${tr('試作用 · この端末に AI がある:', 'Simulation · Local AI available:')}</span><div class="switch" role="group" aria-label="${tr('この端末に AI がある', 'Local AI available')}"><button type="button" data-action="ai-yes" aria-pressed="${state.ai}">${tr('はい', 'Yes')}</button><button type="button" data-action="ai-no" aria-pressed="${!state.ai}">${tr('いいえ', 'No')}</button></div></div></div>
  ${state.notice ? `<div class="toast ${['tooLarge', 'readError', 'mismatch'].includes(state.notice) ? 'error' : ''}">${noticeText()}</div>` : ''}
  <div class="workspace ${review ? 'review-grid' : ''}"><div class="side-stack">${originalPanel(review)}${review ? validationDetails() : candidatesPanel()}</div>${fingerprintPanel(review)}<div class="side-stack">${syntheticPanel(review)}${review ? '' : generatorPanel()}</div></div>${review ? transferColumns() + reviewActions() : mainActions()}</main>
  <footer class="footer"><span>${icon('lock')}${tr('客の CSV は、この端末から出ません。', 'Customer CSV stays on this device.')}</span><span class="quiet">${tr('AI は見本の答え / 外部通信・送信・課金なし', 'AI responses are simulated / No network, sending or charges')}</span></footer>`;
}
function openSettings() {
  const dialog = document.getElementById('settings-dialog');
  dialog.innerHTML = `<div class="dialog-head"><h2 id="settings-title">${tr('設定と動作の範囲', 'Settings & scope')}</h2>${button('close-settings', icon('x') + `<span class="visually-hidden">${tr('閉じる', 'Close')}</span>`)}</div><div class="dialog-content"><span class="badge">${tr('試作 · 全処理がこの画面の中', 'Prototype · everything stays in this page')}</span><h3>${tr('本当に動く所 / 見本の所', 'Live code / simulated AI')}</h3><p>${tr('CSV の読み込み、架空の生成、検査、指紋の照合は JavaScript で動きます。端末の候補と雲の報告は固定の見本です。AI・Firebase・外部の API は呼びません。データはメモリ内だけにあり、ページを閉じる・再読み込みすると消えます。', 'CSV reading, generation, validation and matching use real JavaScript. Local suggestions and cloud drafts are fixed samples. No AI, Firebase or external API is called. Data lives in memory and clears on reload or close.')}</p><h3>${tr('AI エージェント向け', 'For AI agents')}</h3><p>${tr('以下は設計上の道具の一覧です。この試作には呼び出し口を実装していません。', 'These are planned tools, listed for review only. This prototype exposes no callable agent endpoints.')}</p><dl class="details"><div><dt><code>prepare_repro</code></dt><dd>${tr('端末内で再現を作る頼み。承認や共有は行いません。', 'Request local reproduction preparation. Does not approve or share.')}</dd></div><div><dt><code>get_repro</code></dt><dd>${tr('人が承認した架空の再現物だけを返す設計。未承認の物は返しません。', 'Designed to return only a human-approved synthetic reproduction; rejects unapproved objects.')}</dd></div><div><dt><code>get_validation_report</code></dt><dd>${tr('失敗の指紋と検査結果だけを返す設計。元の値・元の行番号は含めません。', 'Designed to return fingerprints and validation results only, without original values or row numbers.')}</dd></div></dl><div class="privacy-card"><h3>${icon('lock')}${tr('口から決して出ない物', 'Never exposed by these tools')}</h3><p>${tr('客の CSV・元のファイル名・行の中身・元の行番号・生ログ・端末 AI の候補。エージェントからの要求で共有の承認を省略できない設計です。', 'Customer CSV, original filename, row contents, original row numbers, raw logs and local AI notes. Agent requests must not bypass human approval.')}</p></div><h3>${tr('検査 r17 の範囲', 'Validator r17 scope')}</h3><p>${tr('UTF-8 → CSV の構造 → 必須列 customer_id / name → セル内改行 → customer_id の重複の順に検査し、最初の失敗で止まります。行番号はヘッダーを除きます。指紋は種類・列・条件で、同じ版での一致を確認します。', 'Checks UTF-8, CSV structure, required columns customer_id / name, embedded newlines, then duplicate customer_id, stopping at the first failure. Row numbers exclude the header. Fingerprints compare error, field and condition using the same validator version.')}</p><p>${tr('実サービスへの書き込みや本番の取り込みは実装していません。Firebase AI Logic の利用可否・API・端末対応は、この資料だけでは未確認です。', 'No production writes or real service importer is implemented. Firebase AI Logic availability, APIs and device support are unverified from the supplied materials.')}</p></div>`;
  dialog.showModal();
}
function showBundle() {
  if (!state.approved || !matched() || state.view !== 'review') return;
  const bundle = C.buildBundle(state.original, state.synthetic, state.approved, draftText());
  const dialog = document.getElementById('bundle-dialog');
  dialog.innerHTML = `<div class="dialog-head"><h2 id="bundle-title">${tr('共有の束のプレビュー', 'Sharing bundle preview')}</h2>${button('close-bundle', icon('x') + `<span class="visually-hidden">${tr('閉じる', 'Close')}</span>`)}</div><div class="dialog-content"><span class="badge">${tr('表示のみ · 送信なし · 保存なし', 'Preview only · not sent · not saved')}</span><p>${tr('これが「書き出す」内容です。この試作は画面表示で止まります。自動送信・ファイルのダウンロードは行いません。', 'This is the export content. The prototype stops at this preview: no automatic sending or file download.')}</p><ul class="bundle-files">${Object.entries(bundle.files).map(([name, file]) => `<li><code>${name}</code><span>${file.encoding} · ${new TextEncoder().encode(file.content).length.toLocaleString()} B</span></li>`).join('')}</ul><label class="field-label" for="bundle-json">${tr('共有の束の全内容（JSON）', 'Full bundle contents (JSON)')}</label><textarea id="bundle-json" readonly spellcheck="false">${esc(JSON.stringify(bundle, null, 2))}</textarea><p class="small">${tr('validation.json は元の値・行番号を含みません。不正な UTF-8 の再現は Base64 を復号すると元のバイト列になります。', 'validation.json excludes original values and row numbers. Decode Base64 to recover the exact bytes for invalid UTF-8 reproductions.')}</p></div>`;
  dialog.showModal();
}
function invalidate() { state.synthetic = null; state.syntheticReport = null; state.approved = false; state.view = 'main'; }
function resetSource() { invalidate(); state.source = null; state.original = null; state.filename = ''; state.candidates = false; state.condition = ''; }
function refreshNotice() { render(); announce(noticeText()); }
function action(name) {
  if (name === 'settings') { openSettings(); return; }
  if (name === 'close-settings') { document.getElementById('settings-dialog').close(); return; }
  if (name === 'close-bundle') { document.getElementById('bundle-dialog').close(); return; }
  if (name === 'bundle') { showBundle(); return; }
  if (name === 'ja' || name === 'en') { state.lang = name; render(); return; }
  if (name === 'sample') {
    loadToken++; resetSource(); state.busy = false; state.source = C.makeSample(); state.filename = 'fictional-demo.csv'; state.original = C.validate(state.source); state.notice = 'loaded';
  } else if (name === 'ai-yes' || name === 'ai-no') {
    const next = name === 'ai-yes'; if (next === state.ai) return;
    state.ai = next; state.candidates = false; state.condition = ''; invalidate(); state.notice = 'aiChanged';
  } else if (name === 'candidates') {
    if (!state.ai || !state.source || state.busy) return;
    state.candidates = true; state.condition = 'duplicate'; invalidate(); state.notice = 'candidates';
  } else if (name === 'generate') {
    if (!state.source || !state.condition || state.busy || state.ai && !state.candidates) return;
    invalidate(); state.synthetic = C.generateSynthetic(state.source, state.condition); state.original = C.validate(state.source); state.syntheticReport = C.validate(state.synthetic.data); state.notice = matched() ? 'matched' : 'mismatch';
  } else if (name === 'rerun') {
    if (!state.source || !state.synthetic) return;
    state.original = C.validate(state.source); state.syntheticReport = C.validate(state.synthetic.data); state.approved = false; state.notice = matched() ? 'matched' : 'mismatch';
  } else if (name === 'review') {
    if (!matched()) return;
    state.view = 'review'; state.approved = false; state.notice = '';
  } else if (name === 'back') { state.view = 'main'; state.approved = false; state.notice = ''; }
  refreshNotice();
  if (name === 'review' || name === 'back') { const title = document.querySelector('h1'); title.setAttribute('tabindex', '-1'); title.focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}
document.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target || target.disabled) return;
  const name = target.dataset.action;
  action(name);
  if (!['settings', 'bundle', 'close-settings', 'close-bundle', 'review', 'back'].includes(name)) document.querySelector(`[data-action="${name}"]`)?.focus();
});
document.addEventListener('change', async event => {
  if (event.target.id === 'condition') {
    state.condition = event.target.value; invalidate(); state.notice = 'changed'; refreshNotice(); document.getElementById('condition')?.focus();
  } else if (event.target.id === 'approval') {
    state.approved = event.target.checked && matched(); render(); document.getElementById('approval')?.focus();
  } else if (event.target.id === 'csv-file') {
    const file = event.target.files[0]; if (!file) return;
    const token = ++loadToken; resetSource(); state.busy = true; state.notice = 'busy'; refreshNotice();
    if (file.size > 2 * 1024 * 1024) { state.busy = false; state.notice = 'tooLarge'; refreshNotice(); return; }
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      if (token !== loadToken) return;
      state.source = C.readBytes(bytes); state.original = C.validate(state.source); state.filename = file.name; state.notice = 'imported';
    } catch (_) { if (token !== loadToken) return; state.notice = 'readError'; }
    state.busy = false; refreshNotice();
  }
});
render();
</script>
